name: cotizaciones
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: cotizaciones
      POSTGRES_PASSWORD: cotizaciones_local
      POSTGRES_DB: cotizaciones
    ports:
      - "127.0.0.1:${COTIZACIONES_POSTGRES_PORT:-55436}:5432"
    volumes:
      - cotizaciones_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotizaciones -d cotizaciones"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pulsar propio: anuncia su nombre de servicio para que el contenedor dev lo alcance.
  # El puerto binario no se publica al host (el broker anuncia "pulsar", no resoluble
  # desde macOS); solo la API de administración para inspección con curl/navegador.
  pulsar:
    image: apachepulsar/pulsar:4.1.3
    command: ["bin/pulsar", "standalone", "--advertised-address", "pulsar"]
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
    ports:
      - "127.0.0.1:${COTIZACIONES_PULSAR_ADMIN_PORT:-18096}:8080"
    volumes:
      - cotizaciones_pulsar:/pulsar/data
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Entorno de desarrollo: Python 3.12.3 + uv 0.10.9. uv, pytest, ruff, mypy, alembic
  # y scripts se ejecutan aquí con el repositorio montado en /app.
  dev:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:0.10.9 AS uv
        FROM python:3.12.3-slim
        COPY --from=uv /uv /uvx /usr/local/bin/
    image: cotizaciones-dev:local
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /opt/uv-cache
      UV_PYTHON_DOWNLOADS: never
      UV_LINK_MODE: copy
      COTIZACIONES_TEST_DATABASE_URL: postgresql+psycopg://cotizaciones:cotizaciones_local@postgres:5432/cotizaciones
      COTIZACIONES_TEST_PULSAR_URL: pulsar://pulsar:6650
      COTIZACIONES_TEST_PULSAR_ADMIN_URL: http://pulsar:8080
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - .:/app
      - cotizaciones_venv:/opt/venv
      - cotizaciones_uv_cache:/opt/uv-cache

volumes:
  cotizaciones_postgres:
  cotizaciones_pulsar:
  cotizaciones_venv:
  cotizaciones_uv_cache:
