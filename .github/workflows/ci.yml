name: CI

on:
  push:
  pull_request:

jobs:
  verificacion-unitaria:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv 0.10.9
        run: |
          curl -LsSf https://astral.sh/uv/0.10.9/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar Python de .python-version
        run: uv python install

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Mypy
        run: uv run --locked mypy src tests scripts migraciones

      - name: Pruebas unitarias, API y contratos
        run: uv run --locked pytest tests/unitarias tests/api tests/contratos -q --tb=short

      - name: Distribucion instalable
        run: uv run --locked python scripts/verify_distribution.py

  integracion-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: cotizaciones
          POSTGRES_PASSWORD: cotizaciones_local
          POSTGRES_DB: cotizaciones
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cotizaciones -d cotizaciones"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      COTIZACIONES_TEST_DATABASE_URL: postgresql+psycopg://cotizaciones:cotizaciones_local@127.0.0.1:5432/cotizaciones
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv 0.10.9
        run: |
          curl -LsSf https://astral.sh/uv/0.10.9/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar Python de .python-version
        run: uv python install

      - name: Sincronizar dependencias
        run: uv sync --locked

      # Ningún módulo de tests/integracion necesita Pulsar todavía; el Paso 42 los incorpora.
      - name: Pruebas de integracion con PostgreSQL
        run: uv run --locked pytest tests/integracion -q --tb=short
