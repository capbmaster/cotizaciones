name: CI

on:
  push:
  pull_request:

jobs:
  verificacion-unitaria:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv 0.10.9
        run: |
          curl -LsSf https://astral.sh/uv/0.10.9/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar Python de .python-version
        run: uv python install

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Mypy
        run: uv run --locked mypy src tests scripts migraciones

      - name: Pruebas unitarias, API y contratos
        run: uv run --locked pytest tests/unitarias tests/api tests/contratos -q --tb=short

      - name: Distribucion instalable
        run: uv run --locked python scripts/verify_distribution.py

  integracion:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: cotizaciones
          POSTGRES_PASSWORD: cotizaciones_local
          POSTGRES_DB: cotizaciones
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cotizaciones -d cotizaciones"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      COTIZACIONES_TEST_DATABASE_URL: postgresql+psycopg://cotizaciones:cotizaciones_local@127.0.0.1:5432/cotizaciones
      COTIZACIONES_TEST_PULSAR_URL: pulsar://127.0.0.1:6650
      COTIZACIONES_TEST_PULSAR_ADMIN_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      # Los contenedores de servicio de Actions no aceptan comando: Pulsar se inicia con docker run.
      # Anuncia 127.0.0.1 porque las pruebas corren en el host del runner.
      - name: Iniciar Pulsar 4.1.3 standalone
        run: >-
          docker run -d --name pulsar -p 6650:6650 -p 8080:8080
          -e PULSAR_MEM="-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
          apachepulsar/pulsar:4.1.3 bin/pulsar standalone --advertised-address 127.0.0.1

      - name: Instalar uv 0.10.9
        run: |
          curl -LsSf https://astral.sh/uv/0.10.9/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar Python de .python-version
        run: uv python install

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Esperar a Pulsar
        run: |
          for intento in $(seq 1 60); do
            if docker exec pulsar bin/pulsar-admin brokers healthcheck > /dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          docker logs pulsar | tail -50
          exit 1

      - name: Pruebas de integracion con PostgreSQL y Pulsar
        run: uv run --locked pytest tests/integracion -q --tb=short
