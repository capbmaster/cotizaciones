[project]
name = "cotizaciones"
version = "0.1.0"
description = "Cotizaciones — Hogar de los Alpes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "pulsar-client[avro]==3.13.0",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "mypy>=1.15,<3",
    "httpx2>=2.12,<3",
]

[build-system]
requires = ["uv_build==0.10.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:cotizaciones.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pulsar", "pulsar.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cotizaciones.modulos.cotizaciones.infraestructura.esquemas.*"
disallow_subclassing_any = false
